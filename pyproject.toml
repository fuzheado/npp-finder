[project]
name = "npp-finder"
version = "0.1.0"
description = "Find new Wikipedia pages with no URL references — a New Pages Patrol utility"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "mwparserfromhell>=0.7",
]

[project.optional-dependencies]
dev = ["tabulate>=0.9"]

[project.scripts]
npp-finder = "npp_finder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"
